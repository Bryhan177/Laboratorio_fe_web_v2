<section id="testimonios" class="w-full bg-gradient-to-b from-white via-[#f8f5fb] to-white dark:from-surface-950 dark:via-surface-900 dark:to-surface-950 py-16 sm:py-20 transition-colors duration-300">
    <div class="mx-auto max-w-7xl px-6">
        <div class="mb-12 text-center">
            <p class="text-base text-[#FF7F02] font-medium">
                Testimonios
            </p>
            <h2 class="text-2xl sm:text-5xl font-bold text-[#28A0AE] tracking-tight leading-tight mb-3">
                Lo que viven en el laboratorio
            </h2>
            <p class="text-lg text-neutral-800 dark:text-surface-200 font-medium leading-relaxed mb-3">
                Voces de quienes han sentido el poder del juego, la recreación y el aprendizaje compartido.
            </p>
        </div>

        <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3 lg:gap-8">
            @for (item of testimonials; track item.name) {
                <article
                    class="flex h-full flex-col rounded-2xl border border-[#830479]/10 dark:border-[#830479]/30 bg-white dark:bg-surface-900 p-6 shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-lg sm:p-8"
                >
                    <i class="pi pi-quote-left mb-4 text-2xl text-[#f87e06]" aria-hidden="true"></i>
                    <p class="mb-6 flex-grow text-base leading-relaxed text-surface-700 dark:text-surface-200">
                        “{{ item.quote }}”
                    </p>
                    <div class="flex items-center gap-3 border-t border-surface-100 dark:border-surface-700 pt-5">
                        <img
                            [src]="item.avatar"
                            [alt]="item.name"
                            class="h-12 w-12 rounded-full object-cover ring-2 ring-[#28a0ae]/30"
                        />
                        <div>
                            <p class="font-semibold text-surface-900 dark:text-surface-0">{{ item.name }}</p>
                            <p class="text-sm text-[#830479] dark:text-[#D9B3E6]">{{ item.role }}</p>
                        </div>
                    </div>
                </article>
            }
        </div>
    </div>
</section>
