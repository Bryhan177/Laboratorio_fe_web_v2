<section class="relative flex min-h-screen w-full items-center justify-center overflow-hidden pt-20">
    <!-- Carrusel: solo slides hidratados (actual + siguiente) -->
    <div class="absolute inset-0 bg-neutral-900">
        @for (i of visibleSlideIndexes(); track i) {
            <div
                class="absolute inset-0 bg-cover bg-center bg-no-repeat brightness-50 grayscale transition-opacity duration-1000 ease-in-out"
                [class.opacity-100]="currentSlide() === i"
                [class.opacity-0]="currentSlide() !== i"
                [style.background-image]="'url(' + slides[i].src + ')'"
                [attr.aria-hidden]="currentSlide() !== i"
                role="img"
                [attr.aria-label]="slides[i].alt"
            ></div>
        }
    </div>

    <!-- Contenido -->
    <div class="relative z-10 rounded-lg p-10 text-center backdrop-blur-sm sm:p-20">
        <h1 class="mx-auto max-w-4xl font-heading text-4xl font-bold leading-[1.2] tracking-tight text-white sm:text-6xl lg:text-7xl">
            Transformando
            <span class="bg-gradient-to-r from-[#28A0AE]/80 via-[#FF7F02] to-[#D9B3E6] bg-clip-text text-4xl font-extrabold text-transparent sm:text-6xl lg:text-7xl"> vidas </span>
            a través del juego y la
            <span class="bg-gradient-to-r from-[#28A0AE]/80 via-[#FF7F02] to-[#D9B3E6] bg-clip-text text-4xl font-extrabold text-transparent sm:text-6xl lg:text-7xl"> recreación </span>
        </h1>
    </div>

    <!-- Indicadores -->
    <div class="absolute bottom-10 left-1/2 z-10 flex -translate-x-1/2 gap-2">
        @for (slide of slides; track slide.src; let i = $index) {
            <button
                type="button"
                class="h-2.5 rounded-full transition-all duration-300"
                [ngClass]="currentSlide() === i ? 'w-8 bg-[#f87e06]' : 'w-2.5 bg-white/50'"
                [attr.aria-label]="'Ir a imagen ' + (i + 1)"
                [attr.aria-current]="currentSlide() === i ? 'true' : null"
                (click)="goToSlide(i)"
            ></button>
        }
    </div>
    <div class="absolute bottom-0 left-0 z-10 w-full p-0.5 bg-gradient-to-r from-[#B7DDE2] via-[#FFDCC2] to-[#D9B3E6]"></div>
</section>
