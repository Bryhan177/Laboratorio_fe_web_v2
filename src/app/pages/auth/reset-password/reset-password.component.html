<div class="auth-shell">
    <div class="fixed top-8 right-8 z-50">
        <app-theme-language-controls variant="floating" />
    </div>

    <div class="pointer-events-none absolute inset-0 overflow-hidden">
        <div class="absolute -left-20 top-16 h-72 w-72 rounded-full bg-[#28A0AE]/25 blur-3xl"></div>
        <div class="absolute -right-16 bottom-10 h-80 w-80 rounded-full bg-[#FF7F00]/20 blur-3xl"></div>
        <div class="absolute left-1/2 top-1/3 h-64 w-64 -translate-x-1/2 rounded-full bg-[#830479]/20 blur-3xl"></div>
    </div>

    <div
        class="relative z-10 w-full max-w-xl px-4"
        [class.animate-welcome-scale-in]="!reducedMotion()"
    >
        <div class="rounded-2xl bg-white/95 shadow-2xl backdrop-blur-sm dark:bg-surface-900/95">
            <div class="relative overflow-visible rounded-t-2xl bg-gradient-to-r from-[#830479] via-[#6a0362] to-[#FF7F00] px-6 py-12 text-center text-white sm:px-10">
                <div class="relative z-10 mx-auto mb-5 flex h-24 w-24 items-center justify-center rounded-full bg-white/15 p-1 shadow-2xl ring-2 ring-white/30 backdrop-blur-sm">
                    <img src="assets/img/logo-Photoroom.png" alt="Laboratorio" class="h-full w-full rounded-full object-contain" />
                </div>
                <h1 class="text-2xl font-bold text-white sm:text-3xl">Nueva contraseña</h1>
                <p class="mt-1 text-sm text-white/85">Elige una contraseña segura</p>
            </div>

            <form class="space-y-5 px-8 py-8 sm:px-12" (ngSubmit)="onSubmit()">
                @if (errorMessage) {
                    <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
                        {{ errorMessage }}
                    </div>
                }

                @if (successMessage) {
                    <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700" role="status">
                        {{ successMessage }}
                    </div>
                }

                <div>
                    <label for="reset-password" class="mb-2 block text-sm font-semibold text-surface-800 dark:text-surface-0">
                        Nueva contraseña
                    </label>
                    <p-password
                        inputId="reset-password"
                        [(ngModel)]="password"
                        name="password"
                        [toggleMask]="true"
                        [feedback]="false"
                        [fluid]="true"
                        autocomplete="new-password"
                        styleClass="w-full"
                    />
                </div>

                <div>
                    <label for="reset-confirm" class="mb-2 block text-sm font-semibold text-surface-800 dark:text-surface-0">
                        Confirmar contraseña
                    </label>
                    <p-password
                        inputId="reset-confirm"
                        [(ngModel)]="confirmPassword"
                        name="confirmPassword"
                        [toggleMask]="true"
                        [feedback]="false"
                        [fluid]="true"
                        autocomplete="new-password"
                        styleClass="w-full"
                    />
                </div>

                <button
                    pButton
                    pRipple
                    type="submit"
                    label="Guardar contraseña"
                    class="w-full !border-none !bg-[#830479] hover:!bg-[#6a0362]"
                    [loading]="loading()"
                    [disabled]="loading()"
                ></button>
            </form>
        </div>
    </div>
</div>
