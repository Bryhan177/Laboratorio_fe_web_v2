<div class="auth-shell">
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
        <div class="absolute -left-20 top-16 h-72 w-72 rounded-full bg-[#28A0AE]/25 blur-3xl"></div>
        <div class="absolute -right-16 bottom-10 h-80 w-80 rounded-full bg-[#FF7F00]/20 blur-3xl"></div>
        <div class="absolute left-1/2 top-1/3 h-64 w-64 -translate-x-1/2 rounded-full bg-[#830479]/20 blur-3xl"></div>
    </div>

    <div
        class="relative z-10 w-full max-w-xl px-4"
        [class.animate-welcome-scale-in]="!reducedMotion()"
    >
        <div class="rounded-2xl bg-white/95 shadow-2xl backdrop-blur-sm dark:bg-surface-900/95">
            <div class="relative overflow-visible rounded-t-2xl bg-gradient-to-r from-[#830479] via-[#6a0362] to-[#FF7F00] px-6 py-12 text-center text-white sm:px-10">
                <div class="relative mx-auto mb-5 flex h-24 w-24 items-center justify-center">
                    @if (!reducedMotion()) {
                        @for (orbit of [0, 1, 2, 3]; track orbit) {
                            <div
                                class="pointer-events-none absolute left-1/2 top-1/2 h-0 w-0 -translate-x-1/2 -translate-y-1/2 animate-welcome-orbit"
                                [style.animationDuration]="(6 + orbit * 2) + 's'"
                                [style.animationDelay]="orbit * 0.5 + 's'"
                            >
                                <span
                                    class="flex h-2.5 w-2.5 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full"
                                    [class]="orbit % 2 === 0 ? 'bg-[#28A0AE]' : 'bg-[#FF7F00]'"
                                ></span>
                            </div>
                        }
                    }

                    <div
                        class="relative z-10 flex h-24 w-24 items-center justify-center rounded-full bg-white/15 p-1 shadow-2xl ring-2 ring-white/30 backdrop-blur-sm"
                        [class.animate-welcome-pulse]="!reducedMotion()"
                    >
                        <img
                            src="assets/img/logo-Photoroom.png"
                            alt="Laboratorio"
                            class="h-full w-full rounded-full object-contain"
                        />
                    </div>
                </div>

                <h1
                    class="text-2xl font-bold text-white sm:text-3xl"
                    [class.animate-welcome-fade-up]="!reducedMotion()"
                >
                    Iniciar sesión
                </h1>
                <p
                    class="mt-1 text-sm text-white/85"
                    [class.animate-welcome-fade-up]="!reducedMotion()"
                >
                    Laboratorio de juego y recreación
                </p>
            </div>

            <form class="space-y-5 px-8 py-8 sm:px-12" (ngSubmit)="onSubmit()">
                @if (errorMessage) {
                    <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
                        {{ errorMessage }}
                    </div>
                }

                @if (successMessage) {
                    <div class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700" role="status">
                        {{ successMessage }}
                    </div>
                }

                <div>
                    <label for="login-email" class="mb-2 block text-sm font-semibold text-surface-800 dark:text-surface-0">
                        Correo electrónico
                    </label>
                    <input
                        pInputText
                        id="login-email"
                        type="email"
                        autocomplete="email"
                        placeholder="tu@correo.com"
                        class="w-full"
                        [(ngModel)]="email"
                        name="email"
                        required
                    />
                </div>

                <div>
                    <label for="login-password" class="mb-2 block text-sm font-semibold text-surface-800 dark:text-surface-0">
                        Contraseña
                    </label>
                    <p-password
                        inputId="login-password"
                        [(ngModel)]="password"
                        name="password"
                        placeholder="Tu contraseña"
                        [toggleMask]="true"
                        [feedback]="false"
                        [fluid]="true"
                        autocomplete="current-password"
                        styleClass="w-full"
                    />
                </div>

                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <p-checkbox [(ngModel)]="rememberMe" name="rememberMe" inputId="remember-me" [binary]="true" />
                        <label for="remember-me" class="text-sm text-surface-600 dark:text-surface-300">Recordarme</label>
                    </div>
                </div>

                <button
                    pButton
                    pRipple
                    type="submit"
                    label="Iniciar sesión"
                    class="w-full !border-none !bg-[#830479] hover:!bg-[#6a0362]"
                    [loading]="loading()"
                    [disabled]="loading()"
                ></button>

                <p class="text-center text-sm text-surface-600 dark:text-surface-300">
                    ¿No tienes cuenta?
                    <a routerLink="/auth/register" class="font-semibold text-[#830479] hover:underline dark:text-[#d48ad0]">
                        Regístrate
                    </a>
                </p>

                <p class="text-center">
                    <a routerLink="/" class="text-sm text-surface-500 hover:text-[#830479] hover:underline">
                        Volver al inicio
                    </a>
                </p>
            </form>
        </div>
    </div>
</div>
