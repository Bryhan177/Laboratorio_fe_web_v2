<div class="min-h-screen flex flex-col justify-between bg-gray-100 dark:bg-surface-900 text-gray-800">
    <!-- Header Superior -->
    <header class="w-full py-4 px-8 flex justify-between items-center border-b border-gray-300 dark:border-gray-100/10 bg-gray-100 dark:bg-surface-900">
        <div class="flex items-center space-x-2">
            <!-- Logo de Tu Marca -->
            <img src="assets/img/logo.jpg" class="h-12 w-12 rounded-full" alt="Logo" />
        </div>
        <div class="flex items-center space-x-4 text-base text-gray-600">
            <span class="flex gap-2 pt-4 pr-2">
                <p class="text-black dark:text-gray-200">¿No tienes usuario?</p>
                <a routerLink="/auth/register" class="text-[#FF7F02] hover:underline">¡Crea uno aquí!</a>
            </span>
            <app-theme-language-controls variant="floating" />
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 flex flex-col lg:flex-row">
        <!-- Lado Izquierdo: Video / Banner -->
        <div class="relative lg:w-7/12 flex items-center justify-center overflow-hidden">
            <!-- Capa de oscurecimiento para mejorar estética -->
            <div class="absolute inset-0 bg-black/20 dark:bg-black/40 z-10 pointer-events-none"></div>
            <!-- Video de fondo -->
            <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0 backdrop-blur-xs">
                <source src="assets/video/LoginVideo.mp4" type="video/mp4" />
            </video>
            <!-- Neblina/Gradiente para mezclar con el lado derecho (oculto en móvil donde el diseño es vertical) -->
            <div class="absolute inset-y-0 right-0 w-1/2 bg-gradient-to-r from-transparent via-gray-100/80 to-gray-100 dark:via-surface-900/80 dark:to-surface-900 z-20 pointer-events-none hidden lg:block"></div>
        </div>

        <!-- Lado Derecho: Formulario de Login -->
        <div class="lg:w-5/12 flex flex-col justify-center items-center p-8 relative isolate overflow-hidden bg-gray-100 dark:bg-surface-900">
            <!-- Capas de fondo complejas -->
            <div class="w-full max-w-lg space-y-6 relative z-10 p-10 rounded-md">
                <h1 class="text-2xl font-bold text-[#28A0AE] dark:text-gray-100 sm:text-5xl text-center drop-shadow-md" [class.animate-welcome-fade-up]="!reducedMotion()">Iniciar sesión</h1>
                <p class="text-lg text-center drop-shadow-md text-black dark:text-gray-200" [class.animate-welcome-fade-up]="!reducedMotion()">Laboratorio de juego y recreación</p>
                <form (ngSubmit)="onSubmit()" class="space-y-4">
                    <div>
                        <label for="login-email" class="mb-2 block text-base font-semibold text-[#28A0AE] dark:text-gray-100"> Correo electrónico </label>
                        <input
                            pInputText
                            id="login-email"
                            type="email"
                            autocomplete="email"
                            placeholder="tu@correo.com"
                            class="w-full bg-white/10 border-white/20 text-white placeholder:text-gray-300 focus:bg-white/20"
                            [(ngModel)]="email"
                            name="email"
                            required
                        />
                    </div>

                    <div>
                        <label for="login-password" class="mb-2 block text-base font-semibold text-[#28A0AE] dark:text-gray-100"> Contraseña </label>
                        <p-password
                            inputId="login-password"
                            [(ngModel)]="password"
                            name="password"
                            placeholder="Tu contraseña"
                            [toggleMask]="true"
                            [feedback]="false"
                            [fluid]="true"
                            class="w-full bg-white/10 border-white/20 text-white placeholder:text-gray-300 focus:bg-white/20"
                            autocomplete="current-password"
                        />
                    </div>

                    <button pButton pRipple type="submit" label="Iniciar sesión" class="w-full text-xl !border-none !bg-[#830479] hover:!bg-[#1e7c87] shadow-lg !text-white" [loading]="loading()" [disabled]="loading()"></button>
                </form>

                <!-- Separador -->
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-300 dark:border-white/20"></div>
                    <span class="flex-shrink mx-4 text-base text-black dark:text-gray-200">O inicie sesión con</span>
                    <div class="flex-grow border-t border-gray-300 dark:border-white/20"></div>
                </div>

                <!-- Botones SSO / Redes -->
                <div class="grid grid-cols-1 items-center justify-center gap-4 text-center text-xs text-gray-200">
                    <button
                        type="button"
                        class="flex gap-2 text-base items-center justify-center p-2 rounded-lg border bg-white dark:dark:bg-surface-800 border-gray-300 dark:border-gray-500/50 text-gray-500 dark:text-white hover:bg-white/10 transition backdrop-blur-sm"
                    >
                        <i class="pi pi-google"></i>
                        <span class="pt-0.5">Conectar con Google</span>
                    </button>
                    <button
                        type="button"
                        class="flex gap-2 text-base items-center justify-center p-2 rounded-lg border bg-white dark:dark:bg-surface-800 border-gray-300 dark:border-gray-500/50 text-gray-500 dark:text-white hover:bg-white/10 transition backdrop-blur-sm"
                    >
                        <i class="pi pi-facebook"></i>
                        <span class="pt-0.5">Conectar con Facebook</span>
                    </button>
                    <button
                        type="button"
                        class="flex gap-2 text-base items-center justify-center p-2 rounded-lg border bg-white dark:bg-surface-800 border-gray-300 dark:border-gray-500/50 text-gray-500 dark:text-white hover:bg-white/10 transition backdrop-blur-sm"
                    >
                        <i class="pi pi-apple"></i>
                        <span class="pt-0.5">Conectar con Apple</span>
                    </button>
                </div>

                <div class="text-center pt-2">
                    <a href="#" class="text-base text-[#FF7F02] hover:underline">¿Ha olvidado la contraseña?</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Inferior -->
    <footer class="py-4 text-center text-base text-gray-500 space-y-2 border-t border-gray-300 dark:border-gray-100/10">
        <div class="space-x-4">
            <a href="#" class="text-[#FF7F02] hover:underline">Ayuda</a>
            <a href="#" class="text-[#FF7F02] hover:underline">Términos</a>
            <a href="#" class="text-[#FF7F02] hover:underline">Privacidad</a>
        </div>
        <p class="max-w-md mx-auto text-xs text-gray-400">Este sitio está protegido por reCAPTCHA y se aplican la Política de privacidad y los Términos del servicio de Google.</p>
    </footer>
</div>
